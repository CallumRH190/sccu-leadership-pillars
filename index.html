:root{
  /* Layout idea: one dark room, one gradient line. Seafoam is the head, pink is James, gradient is agreed. */
  --navy:#182833; --navy-2:#1f3340; --navy-3:#27404f; --navy-deep:#121f28;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.2);
  --ink:#ffffff; --ink-2:rgba(255,255,255,.74); --ink-3:rgba(255,255,255,.52);
  --purple:#6c3481; --pink:#c32e81; --pink-ink:#f07ab8; --sea:#53baab; --warn:#f2b866;
  --grad:linear-gradient(90deg,#6c3481,#c32e81);
  --display:'Comfortaa','Nunito Sans',system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:0;z-index:20;background:rgba(24,40,51,.92);backdrop-filter:blur(10px)}
.top-in{max-width:1220px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.top::after{content:"";display:block;height:2px;background:var(--grad)}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none}
.brand small{font-size:10px;font-weight:800;letter-spacing:.28em;color:var(--ink-3)}
.brand b{font-family:var(--display);font-size:17px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;color:var(--ink-2)}
.nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav a.on{color:#fff;background:rgba(255,255,255,.1)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.pill{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line-2)}
.who:hover{background:rgba(255,255,255,.06)}
.who span{display:flex;flex-direction:column;text-align:left;line-height:1.15;font-size:13px;font-weight:700}
.who small{font-weight:600;color:var(--ink-3);font-size:11px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--navy-3);flex:none}
.av.j{background:var(--pink)} .av.h{background:var(--sea);color:#0e2a26} .av.s{background:var(--purple)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:var(--navy-2);border:1px solid var(--line-2);border-radius:var(--r);padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.menu p{padding:10px 10px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;font-weight:700;font-size:14px}
.menu button small{display:block;font-weight:600;color:var(--ink-3);font-size:12px}
.menu button:hover,.menu button.on{background:rgba(255,255,255,.08)}
.menu hr{border:0;border-top:1px solid var(--line);margin:8px 0}
main{max-width:1220px;margin:0 auto;padding:40px 24px 96px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.page-h h1{font-size:clamp(28px,3.4vw,40px);margin-top:10px}
.page-h p.lead{color:var(--ink-2);max-width:60ch;margin-top:10px;font-size:17px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:800;font-size:15px;background:var(--grad);color:#fff;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:none;border:1px solid var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.sm{padding:8px 16px;font-size:13px}
.link{color:var(--sea);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.sea{border-color:var(--sea);color:var(--sea)}
.chip.ok{border-color:transparent;background:rgba(83,186,171,.16);color:var(--sea)}
.chip.grad{border:0;background:var(--grad);color:#fff}
textarea,input[type=date],input[type=text]{width:100%;font:inherit;color:#fff;background:var(--navy-deep);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus{outline:none;border-color:var(--sea)}
label.fl{display:block;font-weight:700;font-size:14px;margin-bottom:8px}

/* model */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{position:relative;text-align:left;padding:26px 24px 22px;border-radius:var(--r);background:var(--navy-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);transform:scaleX(.18);transform-origin:left;transition:transform .35s}
.pcard:hover{border-color:var(--line-2);transform:translateY(-2px)} .pcard:hover::before{transform:scaleX(1)}
.pcard .opp{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.pcard h2{font-size:27px}
.pcard p{color:var(--ink-2);font-size:15px}
.traits{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.ptabs button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);border:1px solid var(--line)}
.ptabs button.on{background:#fff;color:var(--navy);border-color:#fff}
.ptabs button.done::after{content:" ✓";color:var(--sea)} .ptabs button.on.done::after{color:var(--navy)}
.mdet{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start}
.bigspec{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:10px 0 18px}
.bigspec .o{font-family:var(--display);font-size:22px;color:var(--ink-3)}
.bigspec .ln{flex:1;min-width:60px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.15),#6c3481 40%,#c32e81)}
.bigspec .p{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.6vw,54px)}
.def{font-size:19px;color:var(--ink-2);max-width:58ch}
.tl{display:grid;gap:14px;margin-top:28px}
.tl div{padding-left:16px;border-left:2px solid var(--line-2)}
.tl b{display:block;font-family:var(--display);font-size:16px}
.tl span{color:var(--ink-2);font-size:15px}
.fake{margin-top:28px;padding:18px 20px;border-radius:var(--r);border:1px dashed var(--line-2)}
.fake p{margin-top:6px;color:var(--ink-2)}
.ladder{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:16px 18px;border-radius:14px;background:var(--navy-2);border:1px solid var(--line)}
.rung .n{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink-3)}
.rung p{font-size:15px;color:var(--ink-2)}
.rung small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* self-score stage */
.stage{max-width:940px;margin:0 auto}

.mini{position:relative;height:22px}

/* session */

.clock{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}

.jrow{padding:22px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:24px}

.rv-cta{display:grid;place-items:center;text-align:center;gap:16px;padding:44px 20px;border-radius:var(--r);border:1px solid var(--line);background:radial-gradient(ellipse at 50% 0%,rgba(195,46,129,.22),transparent 65%),var(--navy-2);margin-bottom:8px}

.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink-2);align-items:center}

.xc{border:1px solid var(--line);border-radius:var(--r);background:var(--navy-2);margin-bottom:12px;overflow:hidden}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ev{padding:16px 18px;border-radius:14px;background:var(--navy-deep);border-left:3px solid var(--sea)}

.agree button u{position:absolute;bottom:-9px;width:6px;height:6px;border-radius:50%;text-decoration:none}
.agree button u.h{left:12px;background:var(--sea)}.agree button u.j{right:12px;background:var(--pink)}
.prompt{padding:16px 20px;border-radius:14px;border:1px solid var(--pink);background:rgba(195,46,129,.1);margin-bottom:14px;font-size:15px}
.prompt small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-ink);margin-bottom:4px}
.ftiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ft{padding:16px 12px;border-radius:14px;border:1px solid var(--line);background:var(--navy-2);text-align:left;display:grid;gap:6px}

.ft small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)} .ft.on small{color:#fff}
.asgs{display:grid;gap:10px;margin-top:14px}
.asg{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--navy-2);text-align:left;width:100%}
.asg i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px}
.asg.on{border-color:var(--sea)}.asg.on i{border-color:var(--sea);background:radial-gradient(var(--sea) 45%,transparent 50%)}
.asg small{display:block;color:var(--ink-3);font-size:12px;font-weight:700;margin-top:4px}

/* team */
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-bottom:24px}
.stat small{display:block;margin-bottom:10px}
.stat b{font-family:var(--display);font-size:30px;display:block;line-height:1.1}
.stat p{color:var(--ink-2);font-size:14px;margin-top:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--navy-2)}
table.team{width:100%;border-collapse:collapse;min-width:860px}
.team th{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:16px 8px}
.team th:first-child,.team td:first-child{text-align:left;padding-left:22px}
.team th.weak{color:var(--warn)}
.team td{padding:14px 8px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}

.hd{display:flex;align-items:center;gap:12px}.hd b{display:block;font-size:15px}.hd small{color:var(--ink-3);font-size:12px}
.sc{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--display);font-weight:700;background:rgba(255,255,255,.06)}

.team tfoot td{color:var(--ink-2);font-weight:700;font-size:14px}

/* profile */
.hpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.hpick button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink-2)}
.hpick button.on{background:#fff;color:var(--navy);border-color:#fff}.hpick button.on .dim{color:rgba(24,40,51,.62)}
.move{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,36px);line-height:1.25;max-width:26ch}
.move .up{color:var(--sea)}.move .dn{color:var(--pink-ink)}

/* summary sheet */
.sum-act{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:794px;margin:0 auto 18px}
.sheetwrap{overflow-x:auto}

.sh-t .ag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);font-family:var(--display);font-weight:700}

.sh-focus>div{background:var(--navy);border-radius:12px;padding:18px 22px}

.sh-foot{margin-top:auto;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--ink-3);padding-top:14px;border-top:1px solid var(--line)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.72);display:grid;place-items:center;padding:24px;overflow:auto}
.dlg{width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--navy-2);border:1px solid var(--line-2);border-radius:20px;padding:34px 36px}

function radar(cur,prev,o={}){

 const pt=(i,v)=>{const a=(-90+i*60)*Math.PI/180;return [c+Math.cos(a)*R*v/10,c+Math.sin(a)*R*v/10]};
 const poly=a=>a.map((v,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
 const rings=[2,4,6,8,10].map(r=>`<polygon points="${poly(Array(6).fill(r))}" fill="none" stroke="rgba(255,255,255,.09)"/>`).join('');
 const spokes=P.map((_,i)=>{const[x,y]=pt(i,10);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.09)"/>`}).join('');
 const labels=P.map((p,i)=>{const side=i%3!==0;const[x,y]=pt(i,o.tight?(side?11.6:12):12.4);const an=Math.abs(x-c)<8?'middle':x>c?'start':'end';
  return `<text x="${x}" y="${y}" text-anchor="${an}" dominant-baseline="middle">${p.name}${cur?`<tspan class="s" dx="6">${cur[i]}</tspan>`:''}</text>`}).join('');
 return `<svg class="radar" viewBox="${o.tight?-S_*0.26:-S_*0.14} ${o.tight?S_*0.04:0} ${o.tight?S_*1.52:S_*1.28} ${o.tight?S_*0.92:S_}" width="100%" role="img" aria-label="Six pillar shape">
  <defs><linearGradient id="rg${o.id||''}" x1="0" x2="1"><stop offset="0" stop-color="#6c3481"/><stop offset="1" stop-color="#c32e81"/></linearGradient></defs>
  ${rings}${spokes}
  ${o.std!==false?`<polygon points="${poly(Array(6).fill(STD))}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>`:''}
  ${prev?`<polygon points="${poly(prev)}" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="1.5"/>`:''}
  ${cur?`<polygon ${o.anim&&prev?`data-radar data-from="${prev.join(',')}" data-to="${cur.join(',')}" data-size="${S_}"`:''} points="${poly(o.anim&&prev?prev:cur)}" fill="url(#rg${o.id||''})" fill-opacity=".42" stroke="url(#rg${o.id||''})" stroke-width="2.5" stroke-linejoin="round"/>`:''}
  ${labels}</svg>`;
}
function animRadar(){
 const el=document.querySelector('[data-radar]'); if(!el)return;
 const from=el.dataset.from.split(',').map(Number),to=el.dataset.to.split(',').map(Number),S_=+el.dataset.size,c=S_/2,R=S_*0.33;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){draw(1);return}
 const t0=performance.now()+350;
 function draw(k){el.setAttribute('points',from.map((f,i)=>{const v=f+(to[i]-f)*k,a=(-90+i*60)*Math.PI/180;return (c+Math.cos(a)*R*v/10).toFixed(1)+','+(c+Math.sin(a)*R*v/10).toFixed(1)}).join(' '))}
 (function step(t){let k=Math.min(1,Math.max(0,(t-t0)/800));k=1-Math.pow(1-k,3);draw(k);if(k<1)requestAnimationFrame(step)})(performance.now());
}
function spark(vals){
 const w=140,h=34,n=vals.length; if(!n)return '';
 const x=i=>n===1?w-6:6+i*(w-12)/(n-1), y=v=>h-4-(v-1)/9*(h-8);
 const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(STD)}" y2="${y(STD)}" stroke="rgba(255,255,255,.3)" stroke-dasharray="2 4"/>${n>1?`<path d="${d} L${x(n-1)} ${h} L${x(0)} ${h} Z" fill="rgba(195,46,129,.16)"/><path d="${d}" fill="none" stroke="#c32e81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:''}<circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="4" fill="#fff"/></svg>`}

const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};

 if(o.v!==1||!Array.isArray(o.s)||o.s.length!==6)return null;
 for(const r of o.s){if(!(r[0]>=1&&r[0]<=10)||typeof r[1]!=='string'||!/^\d{4}-\d\d-\d\d$/.test(r[2]))return null}

 if(c.revealed){ui.codeErr=true;return `${first(h)}'s session has already been revealed, so new scores can't be loaded.`}

 c.sealed='LP1.'+b64e(JSON.stringify(o));c.sealedT=o.t||0;c.self={};c.selfAt=o.at||TODAY;S.headId=h.id;ui.codeErr=false;
 return `${o.n?o.n+"'s":'The'} scores are loaded into ${h.name}'s session. They stay hidden until you reveal both sets.`}

function stageOf(h){const c=h.cur; if(c.done)return 'summary'; if(!c.jamesAt)return 'score'; if(!c.selfAt)return 'wait'; if(!c.revealed)return 'reveal'; return c.stage||'explore'}

  ${l?l.ag.map(v=>`<td><span class="sc num ${v<STD?'low':''}" ${v<STD?'title="Below standard"':''}>${v}</span></td>`).join(''):`<td colspan="6" class="dim" style="text-align:left;padding-left:16px">First session to come. No scores yet.</td>`}
  <td><span class="chip ${status(h).cls}">${status(h).t}</span></td><td class="act">${act(h)}</td></tr>`).join('')}</tbody>
 ${has?`<tfoot><tr><td>Team average</td>${avg.map((v,i)=>`<td class="num" style="${i===wi?'color:var(--warn)':''}">${v.toFixed(1)}</td>`).join('')}<td></td><td></td></tr></tfoot>`:''}</table></div>
 <p class="hint" style="margin-top:14px">An outlined score is below the standard of 7. Heads never see this page.${TRIAL?'':" James's and Scott's own scores are kept separately and are not shown here."}</p>`;
}

/* ---------- Profile ---------- */
function vProfile(){
 if(TRIAL&&!isHead()&&!curH())return setupHTML();
 const own=isHead(),h=own?me():curH(),l=latest(h),pv=previous(h),ser=series(h),c=h.cur;
 const pick=own?'':`<div class="hpick">${Object.values(S.heads).map(x=>`<button data-a="head" data-id="${x.id}" class="${x.id===h.id?'on':''}"><i class="av h" style="font-style:normal">${x.ini}</i>${x.name}</button>`).join('')}</div>`;
 if(!l)return pick+`<div class="page-h"><div><p class="eyebrow">${h.dept}</p><h1>${own?'My profile':h.name}</h1></div></div><div class="blank"><div style="width:220px">${radar(null,null,{size:300,id:'e'})}</div><h2>${own?'Your shape appears after your first session.':'No sessions yet.'}</h2><p>${own?'Self-score first. Then you and James agree six scores together, and this page starts tracking how they move month to month.':`${first(h)} is new. The profile starts after the first session.`}</p>${own?'<a class="btn" href="#self-score">Start my self-score</a>':''}</div>`;
 const d=P.map((_,i)=>pv?l.ag[i]-pv.ag[i]:0),ups=P.filter((_,i)=>d[i]>0),dns=P.filter((_,i)=>d[i]<0);
 const mv=!pv?`${own?'Your':first(h)+"'s"} first month on the board.`:(!ups.length&&!dns.length)?`Holding steady since ${mName(pv.m)}.`:
  [ups.length?`<span class="up">${ups.map(p=>p.name+' up '+d[PI[p.id]]).join(', ')}</span>`:'',dns.length?`<span class="dn">${dns.map(p=>p.name+' down '+Math.abs(d[PI[p.id]])).join(', ')}</span>`:''].filter(Boolean).join('. ')+` since ${mName(pv.m)}.`;
 const qs=[...new Set(ser.map(x=>quarter(x.m)))].slice(-2);
 const qavg=(q,i)=>{const a=ser.filter(x=>quarter(x.m)===q);return (a.reduce((s,x)=>s+x.ag[i],0)/a.length).toFixed(1)};
 const lastAsg=c.done?{t:asgText(h),f:c.focus,due:c.due}:(h.hist.length&&h.hist[h.hist.length-1].asg?{t:h.hist[h.hist.length-1].asg,f:h.hist[h.hist.length-1].focus,due:h.hist[h.hist.length-1].due}:null);
 return pick+`<div class="page-h" style="margin-bottom:8px"><div><p class="eyebrow">${own?'My profile':h.dept} · ${mName(l.m)} ${l.m.slice(0,4)}</p><h1>${own?first(h)+', here is your month.':h.name}</h1></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${TRIAL?'':'<span class="chip ok">Integrity: pass</span>'}${l.m!==NOW?`<span class="chip">${mName(NOW)} session still to come</span>`:''}</div></div>
 <p class="move">${mv}</p>
 <div class="prof"><div>${radar(l.ag,pv?pv.ag:null,{anim:true,id:'p'})}<div class="legend" style="justify-content:center;margin-top:6px"><span><i style="background:var(--grad)"></i>${mName(l.m)}</span>${pv?`<span><i style="background:none;border:1.5px solid rgba(255,255,255,.5)"></i>${mName(pv.m)}</span>`:''}<span><i style="background:none;border:1.5px dotted #fff"></i>The standard</span></div></div>
  <div><div class="prow" style="border:0;padding-bottom:4px"><span class="eyebrow">Pillar</span><span class="eyebrow">${ser.length} month${ser.length>1?'s':''}</span><span></span><span></span><span class="eyebrow" style="text-align:right">${qs.join(' · ')} average</span></div>
  ${P.map((p,i)=>`<div class="prow"><b>${p.name}</b>${spark(ser.map(x=>x.ag[i]))}<span class="big num">${l.ag[i]}</span><span class="delta ${d[i]>0?'up':d[i]<0?'dn':'eq'}">${!pv?'':d[i]>0?'▲ '+d[i]:d[i]<0?'▼ '+Math.abs(d[i]):'same'}</span><span class="q num">${l.ag[i]<STD?`<span class="chip ${own?'sea':'warn'}" style="margin-right:10px">${own?'Focus area':'Below standard'}</span>`:''}${qs.map(q=>qavg(q,i)).join(' · ')}</span></div>`).join('')}</div></div>
 <div class="three"><div class="card"><p class="eyebrow">Open assignment${lastAsg?' · '+P[PI[lastAsg.f]].name:''}</p>${lastAsg?`<p style="margin-top:10px">${esc(lastAsg.t)}</p><p class="hint" style="margin-top:10px">Due ${fDateL(lastAsg.due)}. The next session opens with how it went.</p>`:'<p class="empty" style="margin-top:10px">No assignment yet.</p>'}</div>
  ${TRIAL?`<div class="card" style="grid-column:span 2"><p class="eyebrow">Results · from the scorecard</p><p class="empty" style="margin-top:10px">In the full version, ${first(h)}'s scorecard results sit here. Results sit beside the pillars and are never blended into them.</p></div>`:`<div class="card" style="grid-column:span 2"><p class="eyebrow">Results · from the scorecard</p><div class="kpis"><div class="kpi"><b class="num">94%</b><span>Of quarterly target</span></div><div class="kpi"><b class="num">4.6</b><span>Scorecard rating this quarter</span></div><div class="kpi"><b class="num">2 of 3</b><span>Priorities on track</span></div></div><p class="hint" style="margin-top:12px">Sample figures. The live tool pulls these from the existing scorecard. Results sit beside the pillars and are never blended into them.</p></div>`}</div>`;
}

/* ---------- Summary ---------- */
function vSummary(){
 if(TRIAL&&!isHead()&&!curH())return setupHTML();
 const own=isHead(),h=own?me():curH(),c=h.cur;
 const pick=own?'':`<div class="hpick">${Object.values(S.heads).filter(x=>x.cur.done).map(x=>`<button data-a="head" data-id="${x.id}" class="${x.id===h.id?'on':''}"><i class="av h" style="font-style:normal">${x.ini}</i>${x.name}</button>`).join('')}</div>`;
 if(!c.done)return pick+`<div class="blank"><h2>No summary for ${mName(NOW)} yet.</h2><p>${own?'It appears here as soon as you and James finish this month\'s session. One page: your scores, the evidence you discussed, your focus and your assignment.':`${first(h)}'s summary is created when the session is finished.`}</p>${own&&!c.selfAt?'<a class="btn" href="#self-score">Start my self-score</a>':''}</div>`;
 const pv=h.hist[h.hist.length-1],ag=P.map(p=>c.agreed[p.id]),fp=P[PI[c.focus]],canPrint=(()=>{try{return window.self===window.top}catch(e){return false}})();
 return pick+`<div class="sum-act"><span class="hint">One page. ${canPrint?'Save it as a PDF from the print dialog'+(TRIAL?', then send '+first(h)+' a copy.':'.'):'PDF export is switched on in the live tool.'}</span><span style="display:flex;gap:10px">${TRIAL?'<button class="btn ghost sm" data-a="backup">Download a backup</button>':''}${canPrint?'<button class="btn sm" data-a="print">Save as PDF</button>':''}</span></div>
 <div class="sheetwrap"><article class="sheet">
  <div class="sh-top"><div><p class="eyebrow">SCCU Group · Leadership Pillars</p><p class="sh-name">${h.name}</p><p class="muted" style="font-size:14px;margin-top:6px">${h.dept} · Session with James Pease · ${fDateL(c.sessionDate)}</p></div><div style="text-align:right"><p class="eyebrow">Session summary</p><p style="font-family:var(--display);font-weight:700;font-size:20px;margin-top:4px">${mName(NOW)} ${YEAR}</p>${TRIAL?'':'<span class="chip ok" style="margin-top:8px">Integrity: pass</span>'}</div></div>
  <div class="sh-grid"><div>${radar(ag,pv?pv.ag:null,{size:300,id:'s',tight:true})}</div>
   <table class="sh-t"><thead><tr><th>Pillar</th><th>${first(h)}</th><th>James</th><th>Agreed</th><th>Since ${pv?mShort(pv.m):'last'}</th></tr></thead><tbody>
   ${P.map((p,i)=>{const dl=pv?ag[i]-pv.ag[i]:0;return `<tr><td><b>${p.name}</b>${p.id===c.focus?' <span style="color:var(--pink-ink);font-size:11px;font-weight:800">FOCUS</span>':''}</td><td class="num" style="color:var(--sea);font-weight:800">${c.self[p.id].s}</td><td class="num" style="color:var(--pink-ink);font-weight:800">${c.james[p.id].s}</td><td><span class="ag num">${ag[i]}</span></td><td class="num delta ${dl>0?'up':dl<0?'dn':'eq'}">${!pv?'':dl>0?'▲ '+dl:dl<0?'▼ '+Math.abs(dl):'same'}</td></tr>`}).join('')}</tbody></table></div>
  <div><p class="eyebrow" style="margin-bottom:10px">The evidence we discussed</p><div class="sh-ev">${P.map(p=>`<div><b>${p.name}</b><i class="h">${first(h)}, ${fDate(c.self[p.id].d)}.</i> ${esc(c.self[p.id].ex)}<br><i class="j">James, ${fDate(c.james[p.id].d)}.</i> ${esc(c.james[p.id].ex)}</div>`).join('')}</div></div>
  <div class="sh-focus"><div><p class="eyebrow">Focus for the month</p><h3>${fp.name}</h3><p>${esc(asgText(h))}</p><p style="margin-top:10px;color:#fff;font-weight:700">Due ${fDateL(c.due)}</p></div></div>
  <div class="sh-foot"><span>A score is where you were this month, based on what happened this month. Next month starts again, and opens with this assignment.</span><span style="white-space:nowrap">The dotted line is the standard</span></div>
 </article></div>`;
}

/* ---------- gates, sliders, events ---------- */
function gates(){
 document.querySelectorAll('[data-gate]').forEach(b=>{let m='';const g=b.dataset.gate;
  if(g==='self')m=selfMissing(me(),b.dataset.p);
  if(g==='james'){const h=S.heads[S.headId],n=P.filter(p=>full(h.cur.james[p.id])).length;m=n<6?`${n} of 6 complete. Each needs a score, a date and an example of a few words.`:''}
  if(g==='finish')m=finishMissing(S.heads[S.headId]);
  if(g==='newhead')m=((ui.nh&&ui.nh.n)||'').trim().length<2?'Type their name.':'';
  if(g==='hname')m=(me().name||'').trim().length<2?'Type your first name to start.':'';
  b.disabled=!!m;const hint=document.querySelector(`[data-hint="${g}"]`);if(hint){hint.textContent=m;hint.classList.toggle('bad',/One case/.test(m))}});
}
function setScore(sl,v){
 v=Math.max(1,Math.min(10,v));const ctx=sl.dataset.sl,h=S.heads[sl.dataset.h],pid=sl.dataset.p,p=P[PI[pid]];
 const o=h.cur[ctx];if(!o[pid])o[pid]={s:null,ex:'',d:'',over:false};if(o[pid].s===v)return;o[pid].s=v;
 sl.classList.remove('unset');sl.setAttribute('aria-valuenow',v);
 sl.querySelector('.sl-fill').style.width=pct(v)+'%';const th=sl.querySelector('.sl-thumb');th.style.left=pct(v)+'%';th.firstElementChild.textContent=v;
 const w=sl.closest('[data-slwrap]');if(w){const a=w.querySelector('[data-anchor]');a.className=ancCls(v);a.innerHTML=anchorHTML(p,v);
  const wo=w.querySelector('[data-wo]'),wp=w.querySelector('[data-wp]');if(wo){wo.style.opacity=1-(v-1)/9*.7;wp.style.opacity=.3+(v-1)/9*.7}}
 gates();save();
}
function valAt(sl,x){const r=sl.querySelector('.sl-track').getBoundingClientRect();return Math.round((x-r.left)/r.width*9)+1}
let drag=null;
document.addEventListener('pointerdown',e=>{const sl=e.target.closest('.sl');if(!sl||sl.classList.contains('lock'))return;drag=sl;try{sl.setPointerCapture(e.pointerId)}catch(_){}setScore(sl,valAt(sl,e.clientX));e.preventDefault();sl.focus()});
document.addEventListener('pointermove',e=>{if(drag)setScore(drag,valAt(drag,e.clientX))});
document.addEventListener('pointerup',()=>{drag=null});document.addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&(ui.modal||ui.menu)){ui.modal=null;ui.menu=false;render();return}
 const sl=e.target.closest&&e.target.closest('.sl');if(!sl)return;const cur=+sl.getAttribute('aria-valuenow')||0;
 const d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){setScore(sl,cur?cur+d:(d>0?6:5));e.preventDefault()}
 if(e.key==='Home'){setScore(sl,1);e.preventDefault()} if(e.key==='End'){setScore(sl,10);e.preventDefault()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.f){const o=S.heads[t.dataset.h].cur[t.dataset.f],pid=t.dataset.p;if(!o[pid])o[pid]={s:null,ex:'',d:'',over:false};o[pid][t.dataset.k]=t.value;gates();save()}
 else if(t.dataset.nh){ui.nh=ui.nh||{n:'',d:''};ui.nh[t.dataset.nh]=t.value;gates()}
 else if(t.dataset.hn!==undefined){const h=me();h.name=t.value;h.ini=(t.value.trim()[0]||'').toUpperCase();gates();save()}
 else if(t.dataset.code!==undefined){ui.code=t.value}
 else if(t.dataset.jx){S.jx[t.dataset.jx]=t.value;save()}
 else if(t.dataset.own!==undefined){S.heads[S.headId].cur.asgOwn=t.value;gates();save()}
 else if(t.dataset.due!==undefined){S.heads[S.headId].cur.due=t.value;gates();save()}
 else if(t.dataset.over){const o=S.heads[S.headId].cur.james,pid=t.dataset.over;if(!o[pid])o[pid]={s:null,ex:'',d:'',over:false};o[pid].over=t.checked;t.closest('.jrow').querySelector('[data-fake]').style.display=t.checked?'block':'none';save()}});
const A={
 menu(){ui.menu=!ui.menu;ui.confirm=null},
 copy(d){const el=document.getElementById(d.id);copyText(el?el.value:'');ui.copied=d.id},
 share(){const link=pageBase()+'#code='+makeCode(me()),text='My Leadership Pillars scores for our session. Open this on the device you will run the session on: '+link;
  if(navigator.share){navigator.share({text}).catch(()=>{})}else copyText(link);ui.copied='share'},
 unlock(){const h=me();h.cur.selfAt=null;h.cur.changed=true;h.cur.step=6;ui.copied=null;window.scrollTo(0,0)},
 'load-code'(){const o=readCode(ui.code);if(!o){ui.codeErr=true;ui.codeMsg="That doesn't look like a scores code. It starts with LP1.";return}ui.codeMsg=applyCode(o);if(!ui.codeErr)ui.code=''},
 'add-head'(){const n=(ui.nh.n||'').trim(),dp=(ui.nh.d||'').trim();if(n.length<2)return false;const id='h'+Date.now().toString(36);S.heads[id]=mkHead(id,n,dp||'Head of department',[],{});S.headId=id;ui.nh={n:'',d:''};ui.adding=false;ui.open=null;if(S.pending){ui.codeMsg=applyCode(S.pending);ui.noteKeep=1}location.hash='session'},
 'new-head'(){ui.adding=true;ui.menu=false;location.hash='team'}, 'cancel-add'(){ui.adding=false},
 assign(d){ui.codeMsg=applyCode(S.pending,d.id)}, 'drop-pending'(){S.pending=null;ui.codeMsg='';ui.codeErr=false}, dismiss(){ui.codeMsg='';ui.codeErr=false},
 'j-unlock'(){const c=S.heads[S.headId].cur;if(!c.revealed){c.jamesAt=null;window.scrollTo(0,0)}},
 backup(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leadership-pillars-trial-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();ui.menu=false},
 restore(){document.getElementById('rf').click();ui.menu=false},
 clear(){if(ui.confirm!=='clear'){ui.confirm='clear';return}S=seed();ui={menu:false,modal:null,open:null,mopen:null};location.hash=routes()[0][0]},
 role(d){S.role=d.id;ui.menu=false;ui.mopen=null;if(S.heads[d.id]){S.headId=d.id}location.hash=routes()[0][0]},
 reset(){const jx=S.jx||{};S=seed();S.jx=jx;ui={menu:false,modal:null,open:null,mopen:null};location.hash='team'},
 modal(d){ui.modal=d.id}, close(d,el,e){if(e.target.closest('.dlg')&&!e.target.closest('[data-a="close"]'))return false;ui.modal=null},
 mopen(d){ui.mopen=d.id||null;window.scrollTo(0,0)},
 'ss-go'(d){const h=me(),n=+d.id;h.cur.step=Math.max(-1,Math.min(6,n));window.scrollTo(0,0)},
 'ss-submit'(){const h=me();if(allFull(h.cur.self)){h.cur.selfAt=TODAY;h.cur.subT=Date.now();window.scrollTo(0,0)}},
 head(d){S.headId=d.id;ui.open=null},
 sess(d){S.headId=d.id;ui.open=null;location.hash='session'}, sum(d){S.headId=d.id;location.hash='summary'}, prof(d){S.headId=d.id;location.hash='profile'},
 'j-fill'(){const h=S.heads.tom;P.forEach((p,i)=>h.cur.james[p.id]=JSON.parse(JSON.stringify(TOM_SAMPLE[i])))},
 'j-lock'(){const h=S.heads[S.headId];if(allFull(h.cur.james)){h.cur.jamesAt=TODAY;window.scrollTo(0,0)}},
 review(d){S.heads[S.headId].cur.review=d.id},
 reveal(){const h=S.heads[S.headId],c=h.cur;unseal(c);ui.codeMsg='';ui.codeErr=false;c.revealed=true;c.stage='explore';c.startedAt=Date.now();ui.justRevealed=true;ui.open=null;window.scrollTo(0,0)},
 xopen(d){ui.open=ui.open===d.id?null:d.id},
 agree(d){S.heads[S.headId].cur.agreed[d.p]=+d.id},
 stage(d){S.heads[S.headId].cur.stage=d.id;window.scrollTo(0,0)},
 focus(d){const c=S.heads[S.headId].cur;if(c.focus!==d.id){c.focus=d.id;c.asg=null}},
 asg(d){S.heads[S.headId].cur.asg=d.id==='own'?'own':+d.id},
 finish(){const h=S.heads[S.headId],c=h.cur;if(finishMissing(h))return;c.done=true;c.sessionDate=TODAY;c.endedAt=Date.now();location.hash='summary';window.scrollTo(0,0)},
 print(){fitPrint();try{window.print()}catch(e){}}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(!el){if(ui.menu&&!e.target.closest('.menu')){ui.menu=false;render()}return}
 if(el.disabled)return;const fn=A[el.dataset.a];if(!fn)return;
 const before=location.hash;const r=fn(el.dataset,el,e);if(r===false)return;save();
 if(location.hash===before)render();
});
window.addEventListener('hashchange',()=>{ui.menu=false;if(!takeIncoming()){if(ui.noteKeep)ui.noteKeep=0;else{ui.codeMsg='';ui.codeErr=false}}render()});
setInterval(()=>{const el=document.querySelector('[data-clock]');if(!el||!el.dataset.s)return;const t=Math.floor(((+el.dataset.e||Date.now())-+el.dataset.s)/1000);el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},500);
document.addEventListener('change',e=>{if(e.target.id!=='rf')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{let ok=false;try{const o=JSON.parse(r.result);if(o&&o.v===1&&o.heads&&!o.heads.me){S=o;S.role='james';save();ok=true}}catch(_){}
  ui.menu=false;ui.codeErr=!ok;ui.codeMsg=ok?'Backup restored.':"That file isn't a Leadership Pillars backup. Nothing was changed.";if(location.hash!=='#team'){ui.noteKeep=1;location.hash='team'}render();e.target.value=''};r.readAsText(f)});
function fitPrint(){const sh=document.querySelector('.sheet');if(sh)document.documentElement.style.setProperty('--pz',String(Math.min(1,1118/sh.offsetHeight)))}
window.addEventListener('beforeprint',fitPrint);
function takeIncoming(){if(!(TRIAL&&!HEADMODE&&/^#code=/.test(location.hash)))return false;const o=readCode(location.hash.slice(6));try{history.replaceState(null,'',pageBase()+'#session')}catch(e){}
 if(o){ui.codeMsg=applyCode(o);save()}else{ui.codeErr=true;ui.codeMsg="That link didn't carry a readable scores code. Ask for it again, or paste the code."}return true}
takeIncoming();
render();
