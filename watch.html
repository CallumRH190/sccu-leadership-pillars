<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leadership Pillars: how to run a session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#182833;--navy-2:#1f3340;--grad:linear-gradient(90deg,#6c3481,#c32e81);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(195,46,129,.24),transparent 60%),var(--navy);color:#fff;font-family:'Nunito Sans',system-ui,sans-serif;line-height:1.5}
body::before{content:"";display:block;height:6px;background:var(--grad)}
main{max-width:1040px;margin:0 auto;padding:40px 24px 64px;display:grid;gap:22px}
.eb{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
h1{font-family:'Comfortaa',sans-serif;font-size:clamp(28px,4vw,42px);line-height:1.15;text-wrap:balance}
p{color:rgba(255,255,255,.76);font-size:17px;max-width:62ch}
video{width:100%;aspect-ratio:16/9;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:#0f1a22;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
a.btn{display:inline-flex;padding:14px 26px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;text-decoration:none}
a.btn:focus-visible{outline:2px solid #53baab;outline-offset:3px}
small{color:rgba(255,255,255,.55);font-size:14px}
</style>
</head>
<body>
<main>
<span class="eb">SCCU Group · Leadership Pillars</span>
<h1>How to run one session, start to finish.</h1>
<p>A 100 second walkthrough. It shows every click, from the head's self-score to the one-page summary.</p>
<video controls playsinline preload="metadata" poster="poster.jpg" src="walkthrough.mp4"></video>
<div class="row"><a class="btn" href="/">Open Leadership Pillars</a><small>Everything inside is sample data. Reset the demo from the name menu, top right.</small></div>
</main>
</body>
</html>
